databases:
  - name: poscontrol-db
    databaseName: storedb
    user: poscontrol
    plan: free
    region: frankfurt

services:
  - type: web
    name: poscontrol-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && (npx ts-node prisma/seed.ts || true) && node dist/src/main.js
    healthCheckPath: /api/categories
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poscontrol-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: poscontrol-client
    runtime: node
    plan: free
    region: frankfurt
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: poscontrol-server
          property: host
